<title>Средства до 500 ₽: кому что подходит</title>
<style>
:root{color-scheme:dark;--bg:#0a0610;--card:#150d1f;--line:#2c1d42;--text:#f1ebf7;--muted:#a99bb8;--ac:#a259ff;--ac2:#6d28d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 50% -100px,#2a1245,var(--bg));background-color:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
main{max-width:680px;margin:0 auto;padding:20px 14px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;font:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--ac2),var(--ac));border-color:transparent;color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.pic{width:100%;height:200px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;overflow:hidden}
.pic img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.name{font-size:17px;font-weight:600;margin:2px 0 8px}
.badge{flex:none;font-size:12px;background:#24123b;border:1px solid var(--ac2);color:#d9c2ff;border-radius:8px;padding:3px 8px}
.cat{font-size:13px;color:var(--muted);margin-bottom:8px}
.row{font-size:15px;margin:6px 0}
.row b{color:#d9c2ff;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.cnt{color:var(--muted);font-size:13px;margin-top:12px}
</style>
</head>

var cats=[],tags=['все','жирные','сухие','пористые','тонкие','жёсткие'];
D.forEach(function(d){if(cats.indexOf(d[0])<0)cats.push(d[0])});
var fc='Все',ft='все';
function chips(id,arr,cur,cb){var el=document.getElementById(id);el.innerHTML='';arr.forEach(function(a){var b=document.createElement('button');b.className='chip'+(a===cur?' on':'');b.textContent=a;b.onclick=function(){cb(a)};el.appendChild(b)})}
function render(){
 chips('fc',['Все'].concat(cats),fc,function(a){fc=a;render()});
 chips('ft',tags,ft,function(a){ft=a;render()});
 var out='',n=0;
 D.forEach(function(d,i){
  if(fc!=='Все'&&d[0]!==fc)return;

  if(ft!=='все'&&tg.indexOf(ft)<0&&tg.indexOf('все')<0)return;
  n++;

  +'<div class="row"><b>Кому:</b> '+d[3]+'</div>'
  +'<div class="row"><b>Учти:</b> '+d[4]+'</div>'
  +'<div class="tags">'+tg.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div>'
  +'</div>';
 });

 document.getElementById('cnt').textContent='Найдено: '+n;
}
